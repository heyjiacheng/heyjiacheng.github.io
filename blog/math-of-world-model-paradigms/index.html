      .reference-copy .katex,
      .citation-tooltip-copy .katex {

      html[lang="zh-CN"] .article-authors > span:nth-child(-n+4) {
        font-weight: 800;

      .article-footer .article-visitor-badge {

  <body>
    <header class="article-return" aria-label="Article navigation">

    <div id="root"></div>
    <script>
      (function () {
        var badgeHref = "https://visitorbadge.io/status?path=https%3A%2F%2Fsagecao1125.github.io%2Fblog%2Fmath-of-world-model-paradigms%2F";
        var badgeSrc = "https://api.visitorbadge.io/api/combined?path=https%3A%2F%2Fsagecao1125.github.io%2Fblog%2Fmath-of-world-model-paradigms%2F&countColor=%23263759";

        function mountVisitorBadge() {
          var footer = document.querySelector(".article-footer");
          if (!footer || footer.querySelector(".article-visitor-badge")) {
            return;
          }
          var badge = document.createElement("a");
          badge.className = "article-visitor-badge";
          badge.href = badgeHref;
          badge.target = "_blank";
          badge.rel = "noopener noreferrer";

          var image = document.createElement("img");
          image.src = badgeSrc;
          image.alt = "Article visitor count";
          image.loading = "lazy";
          image.decoding = "async";

          badge.appendChild(image);
          footer.appendChild(badge);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", mountVisitorBadge);
        } else {
          mountVisitorBadge();
        }

        var root = document.getElementById("root");
        if (!root || typeof MutationObserver === "undefined") {
          return;
        }
        var observer = new MutationObserver(mountVisitorBadge);
        observer.observe(root, { childList: true, subtree: true });
      })();
    </script>
